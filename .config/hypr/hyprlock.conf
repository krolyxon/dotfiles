# hyprlock, styled like aurora (flat, square, accent borders, JetBrains Mono).
# Colours: pywal first as a fallback, then aurora's resolved palette (incl. the accent picked in its settings),
# written by aurora's Theme.qml to ~/.config/aurora/hyprlock-colors.conf.
source = $HOME/.cache/wal/colors-hyprland.conf
$bg = $background
$fg = $foreground
$accent = $color14
$accentDim = $color6
$surface = $color0
$surfaceHi = $color8
$line = $color8
$dim = $color8
$err = $color1
$font = JetBrainsMono Nerd Font
source = $HOME/.config/aurora/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $bg
}

# -- frame --
shape {
    monitor =
    size = 420, 300
    color = $surface
    rounding = 0
    border_size = 1
    border_color = $line
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>LOCKED</b>
    color = $accent
    font_size = 11
    font_family = $font
    position = 0, 135
    halign = center
    valign = center
}

# -- time / date --
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%H:%M)</b>"
    color = $fg
    font_size = 64
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A %d %B' | tr a-z A-Z
    color = $accent
    font_size = 12
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# -- password --
input-field {
    monitor =
    size = 340, 42
    rounding = 0
    outline_thickness = 2
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    font_family = $font
    check_color = $accentDim
    fail_color = $err
    capslock_color = $accentDim
    dots_size = 0.22
    dots_spacing = 0.4
    dots_rounding = 0
    dots_center = true
    fade_on_empty = false
    placeholder_text = PASSWORD
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, -60
    halign = center
    valign = center
}

# -- status line --
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(cat /etc/hostname)"
    color = $dim
    font_size = 11
    font_family = $font
    position = 20, 16
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] echo "$(mpc current 2>/dev/null | sed 's/&/\&amp;/g; s/</\&lt;/g')   BAT $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $dim
    font_size = 11
    font_family = $font
    position = -20, 16
    halign = right
    valign = bottom
}
