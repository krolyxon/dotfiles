# hyprlock in aurora's Nothing look, after glyph-rice's lock screen: the wallpaper as aurora draws it, a huge Doto clock
# (the colon blinks), the date and weather / what's playing in spaced caps, battery top right; at the bottom your face in
# a ring of dots, your name and the password pill: typed characters are dots, empty = the live caret and six unlit dots.
# Colours / fonts / clock settings: matugen's output first as a fallback, then aurora's resolved palette
# (~/.config/aurora/hyprlock-colors.conf, written by aurora's Theme.qml; `$xHex` = for Pango markup).
# Pictures: ~/.cache/aurora/lock-wall.png + lock-face.png (aurora's LockArt.qml). Live labels: ~/.local/bin/hypr/lockinfo.
# Positions = the centres of glyph's 1920x1080 layout (y up from the middle); sizes in pt = px * 3/4.
$dot = Doto Black
$ui = Space Grotesk
$mono = Space Mono
$fgHex = ##e0e0e0
$s3Hex = ##404040
$greyHex = ##909090
$liveHex = ##e0d080
$errHex = ##ffb4ab
$hourFmt = %H
$blink = 1
$batLow = 15
source = $HOME/.cache/matugen/hyprlock.conf
source = $HOME/.config/aurora/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2500
}

# glyph's timing: everything comes in over 1.1s with aurora's glide, leaves in 0.45s, typed dots pop in 180ms
animations {
    enabled = true
    bezier = glide, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 11, glide
    animation = fadeOut, 1, 4.5, glide
    animation = inputFieldDots, 1, 1.8, glide
    animation = inputFieldColors, 1, 3, glide
    animation = inputFieldWidth, 1, 3, glide
}

background {
    monitor =
    path = ~/.cache/aurora/lock-wall.png
    color = $bg
}

# -- date · clock · weather and music --
label {
    monitor =
    text = cmd[update:60000] echo "<span size='10.5pt' letter_spacing='1505' text_transform='uppercase'>$(date '+%A · %-d %B')</span>"
    color = $fg
    font_size = 10
    font_family = $mono
    position = 0, 360
    halign = center
    valign = center
}

label {
    monitor =
    # Doto 400px; round dots need the variation axes in the markup
    text = cmd[update:500] ~/.local/bin/hypr/lockinfo clock '$hourFmt' $blink 'Doto 300 @ROND=100,wght=900'
    color = $fg
    font_size = 300
    font_family = $dot
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:15000] ~/.local/bin/hypr/lockinfo info
    color = $grey
    font_size = 9
    font_family = $mono
    position = 0, -69
    halign = center
    valign = center
}

# -- battery, top right --
label {
    monitor =
    text = cmd[update:30000] ~/.local/bin/hypr/lockinfo battery $batLow '$errHex' '$fgHex'
    color = $grey
    font_size = 9
    font_family = $mono
    position = -44, -36
    halign = right
    valign = top
}

# -- you --
image {
    monitor =
    path = ~/.cache/aurora/lock-face.png
    size = 104
    rounding = 0
    border_size = 0
    position = 0, -220
    halign = center
    valign = center
}

label {
    monitor =
    text = <span size='16.5pt'>$USER</span>
    color = $fg
    font_size = 16
    font_family = $ui
    position = 0, -298
    halign = center
    valign = center
}

# -- password: dots in a pill; empty = the live caret and six unlit dots --
input-field {
    monitor =
    size = 380, 58
    rounding = -1
    outline_thickness = 1
    outer_color = $s3
    inner_color = $s1
    font_color = $fg
    font_family = $mono
    check_color = $grey
    fail_color = $err
    capslock_color = $live
    dots_size = 0.19
    dots_spacing = 1
    dots_rounding = -1
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground='$liveHex'>│</span>  <span foreground='$s3Hex' size='20.5pt' letter_spacing='8400'>●●●●●●</span>
    fail_text = <span foreground='$errHex' size='9pt' letter_spacing='1290' text_transform='uppercase'>wrong password · try again</span>
    position = 0, -357
    halign = center
    valign = center
}

label {
    monitor =
    text = <span letter_spacing='1290' text_transform='uppercase'>enter password</span>
    color = $grey
    font_size = 9
    font_family = $mono
    position = 0, -411
    halign = center
    valign = center
}
