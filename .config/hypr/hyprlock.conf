# hyprlock in aurora's Nothing look (after glyph-rice's lock screen): a huge Doto clock, the date in spaced caps,
# your name, the password as round dots in a pill, status in Space Mono at the bottom corners.
# Colours / fonts: matugen's output first as a fallback, then aurora's resolved palette
# (~/.config/aurora/hyprlock-colors.conf, written by aurora's Theme.qml).
$dot = Doto Black
$ui = Space Grotesk
$mono = Space Mono
source = $HOME/.cache/matugen/hyprlock.conf
source = $HOME/.config/aurora/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $bg
}

# -- time / date --
label {
    monitor =
    # round dots: Pango takes the variation axes after the size, so they go in the markup, not font_family
    text = cmd[update:1000] echo "<span font_desc='Doto 190 @ROND=100,wght=900'>$(date +%H:%M)</span>"
    color = $fg
    font_size = 190
    font_family = $dot
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3000'>$(date '+%A · %d %B · week %V' | tr a-z A-Z)</span>"
    color = $grey
    font_size = 12
    font_family = $mono
    position = 0, 40
    halign = center
    valign = center
}

# -- who --
label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = $fg
    font_size = 22
    font_family = $ui
    position = 0, -80
    halign = center
    valign = center
}

# -- password: round dots in a pill --
input-field {
    monitor =
    size = 360, 58
    rounding = -1
    outline_thickness = 1
    outer_color = $s3
    inner_color = $s2
    font_color = $fg
    font_family = $mono
    check_color = $fill
    fail_color = $err
    capslock_color = $live
    dots_size = 0.24
    dots_spacing = 0.55
    dots_rounding = -1
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span letter_spacing='2000'>PASSWORD</span>
    fail_text = <span letter_spacing='2000'>$FAIL · $ATTEMPTS</span>
    position = 0, -150
    halign = center
    valign = center
}

# -- status line --
label {
    monitor =
    text = cmd[update:0] echo "<span letter_spacing='2000'>$(echo "$USER@$(cat /etc/hostname)" | tr a-z A-Z)</span>"
    color = $grey
    font_size = 10
    font_family = $mono
    position = 40, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] echo "<span letter_spacing='2000'>$(mpc current 2>/dev/null | tr a-z A-Z | sed 's/&/\&amp;/g; s/</\&lt;/g')   BATTERY $(cat /sys/class/power_supply/BAT0/capacity)%</span>"
    color = $grey
    font_size = 10
    font_family = $mono
    position = -40, 30
    halign = right
    valign = bottom
}
